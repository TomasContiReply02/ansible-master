[defaults]
roles_path = roles/:{{CWD}}/roles
collections_paths = collections/
jinja2_extensions = jinja2.ext.do,jinja2.ext.i18n
host_key_checking = False
retry_files_enabled = False
gathering = explicit
gather_subset = all
gather_timeout = 30
stdout_callback = default
display_skipped_hosts = no
remote_tmp = /tmp/.ansible-${USER}/tmp
timeout = 60
command_timeout = 120
forks = 10

[privilege_escalation]
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
ssh_args = -o ServerAliveInterval=30 -o ControlMaster=auto -o ControlPersist=3600s
control_path_dir = /tmp/.ansible/cp
retries = 2
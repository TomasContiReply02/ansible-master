- name: "installation_script | Copy installer package in {{ execution_path }}"
  ansible.builtin.copy:
    src: "{{ installer_path }}"
    dest: "{{ execution_path }}/{{ ACC_NAME }}-{{ ACC_VERSION }}-{{ installer_file }}"
#    owner: "{{ file_owner }}"
#    group: "{{ file_group }}"
#    mode:  "754"  #"{{ file_perm }}"
  become: true
###########################################################################


- name: "installation_script | Run the Agent installation script"
  ansible.builtin.shell:
    cmd: "bash install_linux-v2.2.bash"
  register: command_result
  become: true
  args:
    chdir: "{{ execution_path }}/"
  environment:
    ACC_API_KEY: "{{ api_key }}"
    ACC_MID: "wss://{{ mid_server_ip }}:{{ mid_server_port }}/ws/events" #"{{ ACC_MID }}"
    ACC_FORCE: "{{ ACC_FORCE }}"
    EXECUTION_TYPE: "{{ AGENT_EXEC_TYPE }}"
    ACC_VERSION: "{{ ACC_VERSION }}"
  ignore_errors: yes


- name: "installation_script | DEBUG: installation script results"
  debug:
    msg: "SCRIPT RESULT= {{ command_result }} "
  when:
    - debug_mode


- name: "installation_script | FAIL: Report installation script failure"
  fail:
    msg: "{{ command_result.stderr }}}"
  when:
    - '"Install process completed successfully" not in command_result.stdout'
    - '"Upgrade process completed successfully" not in command_result.stdout'

- name: "installation_script | Modify parameter in the acc.service"
  block:
    - name: "installation_script | Modify parameter USER in the acc.service"
      ansible.builtin.replace:
        path: "/usr/lib/systemd/system/acc.service"
        regexp: '^User=servicenow'
        replace: "User=root"  ## verify the key skip-tls-verify
      become: true
      register: acc_user

    - name: "installation_script | Modify parameter GROUP in the acc.service"
      ansible.builtin.replace:
        path: "/usr/lib/systemd/system/acc.service"
        regexp: '^Group=servicenow'
        replace: "Group=root"
      become: true
      register: acc_group

    - name: "installation_script | reload systemctl"
      ansible.builtin.shell:
        cmd: "systemctl daemon-reload"
      become: true
      register: cmd_res
      when:
        - '"SLES" not in ansible_facts.distribution'

    - name: "installation_script | Restart agent client collector"
      ansible.builtin.service:
        name: "{{ acc_svc }}"
        state: restarted
      become: true
      register: acc_svc_res
      when:
        - '"SLES" not in ansible_facts.distribution'

    - name: "installation_script | Enable agent client collector"
      ansible.builtin.service:
        name: "{{ acc_svc }}"
        enabled: true
      become: true
      when:
        - '"SLES" not in ansible_facts.distribution'

    - name: "installation_script | SUSE: Restart agent client collector"
      ansible.builtin.shell:
        cmd: "service {{ acc_svc }} restart"
      become: true
      when:
        - '"SLES" in ansible_facts.distribution'

    - name: "installation_script | SUSE: Enable agent client collector"
      ansible.builtin.shell:
        cmd: "chkconfig {{ acc_svc }} on"
      become: true
      when:
        - '"SLES" in ansible_facts.distribution'


    - name: "installation_script | DEBUG: installation script results"
      debug:
        msg: "RESULT= {{ acc_svc_res }}"
      #when:
      #  - debug_mode

- name: "installation_script | Copy check-allow-list.json file"
  ansible.builtin.copy:
    src: "{{ src_check_allow_list }}"
    dest: "{{ dest_check_allow_list }}"
    owner: "{{ file_owner }}"
    group: "{{ file_group }}"
    mode: 0400
  become: true


---

- name: "installation_script | Copy installation script in {{ execution_path }}"
  ansible.builtin.copy:
    src: "{{ script_path }}"
    dest: "{{ execution_path }}/install_linux-v2.2.bash"
    owner: "{{ file_owner }}"
    group: "{{ file_group }}"
    mode:  "754"  #"{{ file_perm }}"
  become: true

- name: "installation_script | set fact debian-8 acc version"
  ansible.builtin.set_fact:
    ACC_VERSION: "3.0.0"
  when:
    - (ansible_distro_lower == 'debian' and ansible_facts.distribution_major_version == "8")

- name: "installation_script | set fact NOT debian-8 acc version"
  ansible.builtin.set_fact:
    ACC_VERSION: "{{ ACC_INSTALL_VER }}" #"3.2.0"
  when:
    - (ansible_distro_lower == 'debian' and ansible_facts.distribution_major_version != "8") or (ansible_distro_lower != 'debian')


- name: "installation_script | set fact debian/ubuntu distro variable"
  ansible.builtin.set_fact:
    installer_file: "{{ INSTALLER_DISTRO[item] }}"
    installer_path: "{{ INSTALLER_BASE_PATH }}/{{ ACC_NAME }}-{{ ACC_VERSION }}-{{ INSTALLER_DISTRO[item] }}"
  with_items:
    - "{{ ansible_distro_lower }}-{{ ansible_facts.distribution_major_version }}"
  when:
    - ansible_distro_lower == 'debian'
    - ansible_distro_lower == 'ubuntu'

- name: "installation_script | set fact other linux distro variable"
  ansible.builtin.set_fact:
    installer_file: "{{ INSTALLER_DISTRO[item] }}"
    installer_path: "{{ INSTALLER_BASE_PATH }}/{{ ACC_NAME }}-{{ ACC_VERSION }}-{{ INSTALLER_DISTRO[item] }}"
  with_items:
    - "el7"
  when:
    - ansible_distro_lower != 'debian'
    - ansible_distro_lower != 'ubuntu'



